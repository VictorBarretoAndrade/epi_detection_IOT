; ESP32 "sinalizador" - acende VERDE (EPI ok) ou VERMELHO (sem EPI).
; Abra ESTA pasta (firmware/esp32_led) como projeto no PlatformIO.
;
; Escolha o ambiente da SUA placa (barra inferior do VS Code ou "pio run -e <nome>"):
;   esp32dev  -> ESP32 DevKit V1 / NodeMCU-32S / WROOM comum (padrao)
;   esp32s3   -> ESP32-S3 DevKitC-1 (usa tambem o LED RGB da placa, GPIO48)
;   esp32s3_octal -> ESP32-S3 com flash/PSRAM octal (N16R8, N32R8) pela USB nativa
;   esp32c3   -> ESP32-C3 DevKitM-1 / SuperMini
;
; Os pinos dos LEDs ficam em build_flags de cada ambiente; mude se precisar.

[platformio]
default_envs = esp32dev

[env]
platform = espressif32 @ ^6
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; Descomente se houver mais de uma porta COM:
; upload_port = COM6
; monitor_port = COM6

[env:esp32dev]
board = esp32dev
build_flags =
    -DPINO_LED_VERDE=26
    -DPINO_LED_VERMELHO=27

[env:esp32s3]
board = esp32-s3-devkitc-1
build_flags =
    -DPINO_LED_VERDE=4
    -DPINO_LED_VERMELHO=5
    ; LED RGB enderecavel da placa (DevKitC-1 v1.0 = 48, v1.1 = 38). -1 desativa.
    -DPINO_LED_RGB=48
    ; 0 = Monitor Serial pela porta "UART/COM"; 1 = pela porta "USB" nativa.
    -DARDUINO_USB_CDC_ON_BOOT=0

; ESP32-S3 com memoria OCTAL (modulos N16R8 / N32R8, ex.: WROOM-2), ligado pela USB nativa.
; esptool mostra "Flash type set in eFuse: octal" / "Embedded PSRAM 8MB (AP_1v8)".
; Com o ambiente esp32s3 comum essa placa fica em loop de boot.
[env:esp32s3_octal]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = opi_opi
board_build.flash_mode = opi
board_upload.flash_size = 32MB
board_upload.maximum_size = 33554432
; Pela USB nativa o reset comum deixa a placa presa no modo de gravacao.
board_upload.after_reset = watchdog_reset
; ATENCAO: nesta placa os GPIO 33 a 37 sao da memoria octal: NAO ligue nada neles.
build_flags =
    -DPINO_LED_VERDE=5  ; fios trocados na protoboard: verde ficou no 5
    -DPINO_LED_VERMELHO=4
    ; Servo no pino 6: alimente com fonte 5 V separada (GND em comum com a placa).
    -DPINO_SERVO=6
    ; Longe dos batentes (0/180): no batente o servo forca, puxa corrente e trava
    -DSERVO_FECHADO=10
    -DSERVO_ABERTO=100
    ; LED RGB da placa (48) desativado: atrapalhava os LEDs depois do boot. Para usar: -DPINO_LED_RGB=48
    -DBOARD_HAS_PSRAM
    ; Serial pela USB nativa (USB-Serial/JTAG)
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32c3]
board = esp32-c3-devkitm-1
build_flags =
    -DPINO_LED_VERDE=3
    -DPINO_LED_VERMELHO=4
    ; C3 SuperMini nao tem conversor USB-serial: o Serial sai pela USB nativa.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
