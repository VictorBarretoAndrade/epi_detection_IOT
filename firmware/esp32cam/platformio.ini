; ESP32-CAM (AI Thinker) - servidor de fotos para o detector de EPI.
; Abra ESTA pasta (firmware/esp32cam) como projeto no PlatformIO.
;
; Gravacao:
;   - Com a base USB "ESP32-CAM-MB": e so conectar e clicar em Upload.
;   - Com adaptador FTDI (3,3 V logica / 5 V alimentacao): ligue IO0 ao GND,
;     aperte RST, faca o Upload, depois solte IO0 do GND e aperte RST de novo.

[platformio]
default_envs = esp32cam

[env:esp32cam]
platform = espressif32 @ ^6
board = esp32cam
framework = arduino
; 2 areas de app de 1,9 MB: permite gravar pelo Wi-Fi (OTA)
board_build.partitions = min_spiffs.csv
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=1
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; A base ESP32-CAM-MB segura a placa em reset se o monitor ativar RTS/DTR.
monitor_rts = 0
monitor_dtr = 0
; Se a gravacao falhar com adaptador FTDI, troque para 115200.
upload_speed = 460800
; Descomente se houver mais de uma porta COM:
; upload_port = COM5
; monitor_port = COM5

; Gravacao pelo Wi-Fi (depois de gravar UMA vez pelo USB com este firmware):
;   pio run -e esp32cam_ota -t upload
; Se definiu OTA_SENHA no credenciais.h, descomente upload_flags com a mesma senha.
[env:esp32cam_ota]
extends = env:esp32cam
upload_protocol = espota
upload_port = epi-cam.local
; upload_flags = --auth=SUA_SENHA_OTA
