# A base ESP32-CAM-MB (CH340) as vezes nao entra no modo de gravacao com o tempo padrao
# do esptool ("Failed to connect ... No serial data received"). Uma sequencia de reset
# mais lenta resolve na maioria das placas (D = DTR/IO0, R = RTS/EN, W = espera em s).
[esptool]
custom_reset_sequence = D0|R1|W0.25|D1|R0|W0.6|D0
connect_attempts = 10
