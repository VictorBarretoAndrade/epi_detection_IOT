; Teste do servo SOZINHO (sem Wi-Fi, sem detector): varre de um lado ao outro sem parar.
; Grave, veja se o servo mexe, depois grave de novo o firmware/esp32_led.
[env:esp32s3_octal]
platform = espressif32 @ ^6
framework = arduino
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = opi_opi
board_build.flash_mode = opi
board_upload.flash_size = 32MB
board_upload.maximum_size = 33554432
board_upload.after_reset = watchdog_reset
monitor_speed = 115200
build_flags =
    -DPINO_SERVO=6
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
